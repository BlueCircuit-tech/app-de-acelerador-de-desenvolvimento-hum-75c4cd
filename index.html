<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Refúgio Interior</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Source+Serif+4:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50: '#f0f5ff',
              100: '#dbe4ff',
              200: '#b8cdfe',
              300: '#8aabfc',
              400: '#5a82f8',
              500: '#2563EB',
              600: '#1d4fd4',
              700: '#173daa',
              800: '#1E3A5F',
              900: '#142845',
              950: '#0c1628',
            },
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            body: ['"Source Serif 4"', 'Georgia', 'serif'],
          },
          boxShadow: {
            card: '0 1px 3px rgba(30,58,95,0.08), 0 4px 12px rgba(30,58,95,0.04)',
            cardHover: '0 2px 8px rgba(30,58,95,0.10), 0 8px 24px rgba(30,58,95,0.06)',
            cardUp: '0 4px 12px rgba(30,58,95,0.12), 0 12px 32px rgba(30,58,95,0.08)',
            nav: '0 -1px 3px rgba(30,58,95,0.06)',
            modal: '0 16px 48px rgba(12,22,40,0.20)',
            float: '0 4px 16px rgba(37,99,235,0.20)',
          },
        },
      },
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Source Serif 4', Georgia, serif; background: #c7d2e0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: rgba(30,58,95,0.15); border-radius: 4px; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    [data-tela]:not(.hidden) { animation: fadeSlideIn 0.30s ease-out; }

    .ativo { color: #2563EB !important; }
    .ativo .nav-icon { stroke: #2563EB !important; }
    .ativo::before {
      content: ''; position: absolute; top: -1px; left: 50%; transform: translateX(-50%);
      width: 28px; height: 3px; background: #2563EB; border-radius: 0 0 3px 3px;
    }

    [data-tela] { -webkit-overflow-scrolling: touch; }
    :focus-visible { outline: 2px solid #2563EB; outline-offset: 2px; border-radius: 6px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 24px; border-radius: 12px; font-family: 'Source Serif 4', Georgia, serif;
      font-weight: 600; font-size: 15px; border: none; cursor: pointer;
      transition: all 0.2s ease; white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #2563EB; color: #F8FAFC; box-shadow: 0 2px 8px rgba(37,99,235,0.25); }
    .btn-primary:hover { background: #1d4fd4; box-shadow: 0 4px 14px rgba(37,99,235,0.35); }
    .btn-outline { background: transparent; color: #2563EB; border: 1.5px solid #2563EB; }
    .btn-outline:hover { background: #f0f5ff; }
    .btn-ghost { background: transparent; color: #1E3A5F; }
    .btn-ghost:hover { background: #f0f5ff; }
    .btn-success { background: #059669; color: #F8FAFC; }
    .btn-success:hover { background: #047857; }
    .btn-danger { background: #DC2626; color: #F8FAFC; }
    .btn-danger:hover { background: #B91C1C; }
    .btn-sm { padding: 8px 16px; font-size: 13px; border-radius: 10px; }
    .btn-w-full { width: 100%; }

    .card {
      background: #fff; border-radius: 16px; padding: 20px;
      box-shadow: 0 1px 3px rgba(30,58,95,0.08), 0 4px 12px rgba(30,58,95,0.04);
      transition: box-shadow 0.25s ease, transform 0.25s ease;
    }
    .card-interactive { cursor: pointer; }
    .card-interactive:hover { box-shadow: 0 2px 8px rgba(30,58,95,0.10), 0 8px 24px rgba(30,58,95,0.06); transform: translateY(-1px); }
    .card-interactive:active { transform: scale(0.985); }

    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
      font-family: 'Source Serif 4', Georgia, serif;
    }
    .badge-info    { background: #dbe4ff; color: #1d4fd4; }
    .badge-success { background: #d1fae5; color: #065f46; }
    .badge-warning { background: #fef3c7; color: #92400e; }
    .badge-danger  { background: #fee2e2; color: #991b1b; }
    .badge-neutral { background: #f1f5f9; color: #475569; }

    .nav-icon { transition: stroke 0.2s ease; }

    #toast-box { position: fixed; top: 48px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; width: 340px; max-width: 92vw; pointer-events: none; }
    .toast-item {
      padding: 14px 18px; border-radius: 14px; font-size: 14px; font-weight: 500;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 4px 16px rgba(12,22,40,0.15); animation: fadeSlideIn 0.25s ease-out;
      font-family: 'Source Serif 4', Georgia, serif; pointer-events: auto;
    }
    .toast-item.t-ok    { background: #059669; color: #F8FAFC; }
    .toast-item.t-erro  { background: #DC2626; color: #F8FAFC; }
    .toast-item.t-info  { background: #1E3A5F; color: #F8FAFC; }

    #modal-overlay {
      position: fixed; inset: 0; background: rgba(12,22,40,0.50); z-index: 9000;
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    #modal-overlay.open { opacity: 1; pointer-events: auto; }
    #modal-box {
      background: #fff; width: 100%; max-width: 420px; max-height: 80dvh;
      border-radius: 24px 24px 0 0; padding: 0; display: flex; flex-direction: column;
      transform: translateY(100%); transition: transform 0.30s ease;
    }
    #modal-overlay.open #modal-box { transform: translateY(0); }
    #modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 14px; border-bottom: 1px solid #f1f5f9; flex-shrink: 0; }
    #modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
    #modal-close { width: 32px; height: 32px; border-radius: 50%; border: none; background: #f1f5f9; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; flex-shrink: 0; }
    #modal-close:hover { background: #e2e8f0; }

    .step-dot { width: 10px; height: 10px; border-radius: 50%; transition: background 0.2s; }
    .step-dot.done  { background: #059669; }
    .step-dot.active { background: #2563EB; }
    .step-dot.pending { background: #cbd5e1; }

    .progress-ring { transform: rotate(-90deg); }
  </style>
</head>
<body class="bg-gray-400/60">

  <!-- ========== APP FRAME ========== -->
  <div id="app-frame" class="bg-marca-950 w-full max-w-[390px] max-h-[100dvh] sm:max-h-[844px] sm:rounded-[40px] shadow-2xl overflow-hidden relative flex flex-col">

    <!-- Status Bar -->
    <div class="flex items-center justify-between px-8 pt-3 pb-1 select-none flex-shrink-0">
      <span class="text-marca-50 text-xs font-semibold tracking-wide font-body" id="status-time">09:41</span>
      <div class="flex items-center gap-1.5">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="6" width="3" height="6" rx="0.75" fill="#F8FAFC" opacity="0.5"/><rect x="4.5" y="4.5" width="3" height="7.5" rx="0.75" fill="#F8FAFC" opacity="0.65"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.75" fill="#F8FAFC" opacity="0.8"/><rect x="13.5" y="0" width="2.5" height="12" rx="0.75" fill="#F8FAFC"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><rect x="0.5" y="0.5" width="13" height="10" rx="2" stroke="#F8FAFC" stroke-opacity="0.7"/><rect x="2" y="2" width="9" height="7" rx="1" fill="#2563EB" opacity="0.8"/><rect x="14" y="3.5" width="1.5" height="4" rx="0.75" fill="#F8FAFC" opacity="0.5"/></svg>
        <svg width="25" height="11" viewBox="0 0 25 11" fill="none"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#F8FAFC" stroke-opacity="0.7"/><rect x="2" y="2" width="17" height="7" rx="1.5" fill="#2563EB" opacity="0.85"/><rect x="22" y="3.75" width="2" height="3.5" rx="0.5" fill="#F8FAFC" opacity="0.4"/></svg>
      </div>
    </div>

    <!-- Dynamic Island -->
    <div class="absolute top-[13px] left-1/2 -translate-x-1/2 w-[82px] h-[22px] bg-marca-950 rounded-full z-50"></div>

    <!-- Main Content -->
    <main id="app-main" class="flex-1 overflow-y-auto bg-marca-50 relative">

      <!-- ===== TELAS ===== -->
      <div data-tela="visao-geral" class="hidden"></div>
      <div data-tela="novo-diagnostico" class="hidden"></div>
      <div data-tela="meu-resultado" class="hidden"></div>
      <div data-tela="regulacao-emocional" class="hidden"></div>
      <div data-tela="minhas-metas" class="hidden"></div>
      <div data-tela="meus-alertas" class="hidden"></div>
      <div data-tela="assinatura" class="hidden"></div>
      <div data-tela="chat-de-suporte" class="hidden"></div>
      <div data-tela="painel-profissional" class="hidden"></div>
      <!-- TELAS -->

    </main>

    <!-- ========== BOTTOM NAV ========== -->
    <nav class="flex-shrink-0 bg-white/95 backdrop-blur-md border-t border-marca-100/60 shadow-nav relative">
      <div class="flex items-center justify-around px-1 pt-2 pb-6">
        <button data-nav="visao-geral" onclick="mostrarTela('visao-geral')" class="nav-btn ativo relative flex flex-col items-center gap-[3px] py-1 px-2 text-marca-800/40 transition-colors duration-200" aria-label="Visão Geral">
          <svg class="nav-icon w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="text-[10px] font-semibold">Visão Geral</span>
        </button>
        <button data-nav="novo-diagnostico" onclick="mostrarTela('novo-diagnostico')" class="nav-btn relative flex flex-col items-center gap-[3px] py-1 px-2 text-marca-800/40 transition-colors duration-200" aria-label="Novo Diagnóstico">
          <svg class="nav-icon w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>
          <span class="text-[10px] font-semibold">Diagnóstico</span>
        </button>
        <button data-nav="meu-resultado" onclick="mostrarTela('meu-resultado')" class="nav-btn relative flex flex-col items-center gap-[3px] py-1 px-2 text-marca-800/40 transition-colors duration-200" aria-label="Meu Resultado">
          <svg class="nav-icon w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span class="text-[10px] font-semibold">Resultado</span>
        </button>
        <button data-nav="regulacao-emocional" onclick="mostrarTela('regulacao-emocional')" class="nav-btn relative flex flex-col items-center gap-[3px] py-1 px-2 text-marca-800/40 transition-colors duration-200" aria-label="Regulação Emocional">
          <svg class="nav-icon w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
          <span class="text-[10px] font-semibold">Regulação</span>
        </button>
        <button data-nav="minhas-metas" onclick="mostrarTela('minhas-metas')" class="nav-btn relative flex flex-col items-center gap-[3px] py-1 px-2 text-marca-800/40 transition-colors duration-200" aria-label="Minhas Metas">
          <svg class="nav-icon w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          <span class="text-[10px] font-semibold">Metas</span>
        </button>
        <button data-nav="meus-alertas" onclick="mostrarTela('meus-alertas')" class="nav-btn relative flex flex-col items-center gap-[3px] py-1 px-2 text-marca-800/40 transition-colors duration-200" aria-label="Meus Alertas">
          <svg class="nav-icon w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="text-[10px] font-semibold">Alertas</span>
        </button>
        <button data-nav="assinatura" onclick="mostrarTela('assinatura')" class="nav-btn relative flex flex-col items-center gap-[3px] py-1 px-2 text-marca-800/40 transition-colors duration-200" aria-label="Assinatura">
          <svg class="nav-icon w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          <span class="text-[10px] font-semibold">Assinatura</span>
        </button>
        <button data-nav="chat-de-suporte" onclick="mostrarTela('chat-de-suporte')" class="nav-btn relative flex flex-col items-center gap-[3px] py-1 px-2 text-marca-800/40 transition-colors duration-200" aria-label="Chat de Suporte">
          <svg class="nav-icon w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          <span class="text-[10px] font-semibold">Suporte</span>
        </button>
        <button data-nav="painel-profissional" onclick="mostrarTela('painel-profissional')" class="nav-btn relative flex flex-col items-center gap-[3px] py-1 px-2 text-marca-800/40 transition-colors duration-200" aria-label="Painel Profissional">
          <svg class="nav-icon w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="text-[10px] font-semibold">Profissional</span>
        </button>
      </div>
    </nav>

  </div><!-- /app-frame -->

  <!-- ========== TOAST CONTAINER ========== -->
  <div id="toast-box"></div>

  <!-- ========== MODAL ========== -->
  <div id="modal-overlay" onclick="if(event.target===this)fecharModal()">
    <div id="modal-box">
      <div id="modal-header">
        <h3 id="modal-title" class="font-display text-lg font-semibold text-marca-800"></h3>
        <button id="modal-close" onclick="fecharModal()" aria-label="Fechar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E3A5F" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- ========== UTILITÁRIOS ========== -->
  <script>
    // Atualiza relógio da barra de status
    (function(){
      var el = document.getElementById('status-time');
      if(!el) return;
      function tick(){
        var d = new Date();
        el.textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      }
      tick();
      setInterval(tick, 30000);
    })();

    // Toast
    function toast(mensagem, tipo) {
      var box = document.getElementById('toast-box');
      var icons = { ok: '✓', erro: '✕', info: 'ℹ' };
      var el = document.createElement('div');
      el.className = 'toast-item t-' + (tipo || 'info');
      el.innerHTML = '<span style="font-size:16px;flex-shrink:0;">' + (icons[tipo] || '') + '</span><span>' + mensagem + '</span>';
      box.appendChild(el);
      setTimeout(function(){ el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; }, 2700);
      setTimeout(function(){ el.remove(); }, 3050);
    }

    // Modal
    function abrirModal(html, titulo) {
      document.getElementById('modal-title').textContent = titulo || '';
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('modal-overlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function fecharModal() {
      document.getElementById('modal-overlay').classList.remove('open');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') fecharModal(); });

    // Formatação
    function brl(valor) {
      return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function dataBR(iso) {
      if (!iso) return '—';
      var d = new Date(iso + 'T12:00:00');
      return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
    }

    // Inicializa navegação
    mostrarTela('visao-geral');
  </script>

</body>
</html>
